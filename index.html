<style>
/* ── tokens ─────────────────────────────────────────────── */
:root{
  --stage:#F2F0FC;        /* pale lilac house-light */
  --paper:#FFFFFF;
  --ink:#221A3C;          /* aubergine-ink */
  --ink2:#605779;
  --violet:#5B3CC4;       /* drongo gloss — brand */
  --violet-soft:#EBE5FF;
  --marigold:#FFA630;     /* garland */
  --mint:#57C4A5;         /* calm */
  --rose:#E85C8A;         /* playful */
  --line:#E4DFF7;
  --shadow-s:0 2px 6px -2px rgba(34,26,60,.12);
  --shadow-m:0 18px 38px -24px rgba(34,26,60,.38);
  --shadow-l:0 34px 60px -30px rgba(34,26,60,.30);
  --r:22px;
  --r-s:12px;
  --wrap:1140px;
  --hdr:78px;
  --ease:cubic-bezier(.22,.7,.28,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  margin:0; background:var(--stage); color:var(--ink);
  font-family:'Anek Kannada',system-ui,sans-serif; font-weight:400;
  font-size:17px; line-height:1.65; overflow-x:hidden; overflow-wrap:break-word;
  -webkit-tap-highlight-color:transparent;
}
html[data-lang="kn"] body{line-height:1.8}
img{max-width:100%; display:block}
a{color:inherit; text-decoration:none}
button{font-family:inherit}

/* display face swaps with language */
.display{font-weight:700; letter-spacing:-.01em; line-height:1.15; margin:0}
html[data-lang="kn"] .display{font-family:'Baloo Tamma 2',system-ui,sans-serif; font-weight:700; line-height:1.35}
html[data-lang="en"] .display{font-family:'Fraunces',Georgia,serif; font-variation-settings:'SOFT' 40,'WONK' 1}

.wrap{max-width:var(--wrap); margin:0 auto; padding-left:max(22px,env(safe-area-inset-left)); padding-right:max(22px,env(safe-area-inset-right))}
section[id]{scroll-margin-top:calc(var(--hdr) + 16px)}
.eyebrow{
  font-size:12.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--violet); display:flex; align-items:center; gap:9px;
}
html[data-lang="kn"] .eyebrow{letter-spacing:.06em; text-transform:none; font-size:14px}
.eyebrow::before{content:""; width:22px; height:2px; background:var(--marigold); border-radius:2px; flex:none}
.sect{padding-block:96px 8px}
.sect-head{max-width:660px; margin-bottom:38px}
.sect-head h2{font-size:clamp(30px,4.4vw,46px); margin:12px 0 10px}
.sect-head p{color:var(--ink2); margin:0; font-size:17.5px}
:focus-visible{outline:3px solid var(--violet); outline-offset:3px; border-radius:6px}

/* ── preview strip ──────────────────────────────────────── */
#preview-bar{
  background:var(--ink); color:#EFEAFF; font-size:13.5px;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding:9px 46px 9px 22px; position:relative;
}
#preview-bar b{color:var(--marigold); font-weight:600}
#preview-bar button{
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:transparent; border:1px solid rgba(255,255,255,.3); color:inherit;
  width:26px; height:26px; border-radius:50%; cursor:pointer; line-height:1;
}

/* ── header ─────────────────────────────────────────────── */
header{
  position:sticky; top:0; z-index:60;
  background:rgba(242,240,252,.82); -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4);
  border-bottom:1px solid var(--line);
}
.bar{display:flex; align-items:center; gap:20px; height:var(--hdr)}
/* logo — top left */
.logo{display:flex; align-items:center; gap:11px; flex:none}
.logo-badge{
  width:46px; height:46px; border-radius:14px; flex:none;
  background:linear-gradient(150deg,var(--violet),#8B5CF6 60%,var(--rose));
  display:grid; place-items:center; box-shadow:var(--shadow-s);
}
.logo-badge svg{width:29px; height:29px}
.logo-name{font-size:23px; line-height:1; margin:0}
html[data-lang="kn"] .logo-name{font-family:'Baloo Tamma 2',sans-serif; font-weight:800}
html[data-lang="en"] .logo-name{font-family:'Fraunces',serif; font-weight:900; letter-spacing:-.02em}
.logo-sub{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink2); font-weight:600}

nav{margin-left:auto; display:flex; align-items:center; gap:4px}
nav a{padding:9px 13px; border-radius:99px; font-size:15.5px; font-weight:500; color:var(--ink2); transition:.2s var(--ease)}

.lang{display:flex; background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:3px; margin-left:8px; flex:none}
.lang button{
  border:0; background:transparent; cursor:pointer; padding:6px 13px; border-radius:99px;
  font-size:14px; font-weight:600; color:var(--ink2); transition:.2s var(--ease);
}
.lang button[aria-pressed="true"]{background:var(--ink); color:#fff}
.burger{display:none; margin-left:auto; background:var(--paper); border:1px solid var(--line); border-radius:12px; width:44px; height:44px; cursor:pointer}
.burger span{display:block; width:18px; height:2px; background:var(--ink); margin:3.5px auto; border-radius:2px}

/* ── hero: the lit stage, founder centre ────────────────── */
.hero{position:relative; overflow:hidden; padding:74px 0 40px; text-align:center}
.gels{position:absolute; inset:-10% 0 auto; height:120%; width:100%; pointer-events:none; z-index:0}
.gels svg{width:100%; height:100%; mix-blend-mode:multiply; opacity:.75}
.hero .wrap{position:relative; z-index:1}
.hero-eyebrow{justify-content:center; margin-bottom:18px}
.hero-eyebrow::before{display:none}
.hero-eyebrow span{
  background:var(--paper); border:1px solid var(--line); box-shadow:var(--shadow-s);
  padding:7px 16px; border-radius:99px; color:var(--violet); font-weight:600;
}

.founder{display:inline-block; position:relative; margin:6px 0 4px}
.medallion{
  width:158px; height:158px; border-radius:50%; margin:0 auto;
  background:radial-gradient(circle at 32% 26%,#fff 0%,var(--violet-soft) 46%,#CFC2FF 100%);
  border:5px solid var(--paper); box-shadow:var(--shadow-m);
  display:grid; place-items:center; position:relative;
}
.medallion i{
  font-style:normal; font-size:66px; color:var(--violet); line-height:1;
  font-family:'Baloo Tamma 2',sans-serif; font-weight:700;
}
/* photo sits over the monogram; if it fails to load the monogram shows through */
.medallion img{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:50% 30%; border-radius:50%;
}
.perch{position:absolute; top:-16px; right:-14px; width:44px; height:44px; background:var(--marigold); border-radius:50% 50% 50% 12px; display:grid; place-items:center; box-shadow:var(--shadow-s)}
.perch svg{width:26px; height:26px; transform:scaleX(-1)}
.founder-role{margin-top:16px; font-size:13px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--ink2)}
html[data-lang="kn"] .founder-role{letter-spacing:.04em; text-transform:none; font-size:15px}
.founder-name{font-size:clamp(28px,4.6vw,44px); margin:4px 0 0}
.hero h1{font-size:clamp(34px,6.4vw,68px); margin:22px auto 0; max-width:15ch}
.hero h1 em{font-style:normal; color:var(--violet); position:relative; white-space:nowrap}
.hero h1 em::after{
  content:""; position:absolute; left:0; right:0; bottom:.06em; height:.34em;
  background:var(--marigold); opacity:.34; border-radius:99px; z-index:-1;
}
.quote{
  max-width:600px; margin:22px auto 0; font-size:19px; color:var(--ink2);
  position:relative; padding:0 30px;
}
.quote::before,.quote::after{content:"“"; font-family:'Fraunces',serif; font-size:44px; color:var(--rose); position:absolute; top:-6px; left:0; line-height:1}
.quote::after{content:"”"; left:auto; right:0}
.cta-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:32px}
.btn{
  display:inline-flex; align-items:center; gap:9px; padding:14px 26px; border-radius:99px;
  font-weight:600; font-size:16px; border:1px solid transparent; cursor:pointer;
  transition:transform .22s var(--ease), box-shadow .22s var(--ease), background .2s;
}
.btn-primary{background:var(--ink); color:#fff; box-shadow:var(--shadow-m)}
.btn-ghost{background:var(--paper); border-color:var(--line); color:var(--ink); box-shadow:var(--shadow-s)}

/* ── third bell ticker ──────────────────────────────────── */
.bell{margin-top:56px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--paper)}
.bell-in{display:flex; align-items:center; gap:0; overflow:hidden}
.bell-label{
  flex:none; padding:15px 20px; background:var(--marigold); color:#4A2C00;
  font-weight:700; font-size:14px; letter-spacing:.06em; display:flex; align-items:center; gap:8px;
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%); padding-right:30px;
}
.marquee{overflow:hidden; flex:1; -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent); mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.marquee-track{display:flex; gap:0; width:max-content; animation:slide 34s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.tick{display:flex; align-items:center; gap:10px; padding:15px 26px; font-size:15.5px; white-space:nowrap; color:var(--ink2)}
.tick b{color:var(--ink); font-weight:600}
.tick .dot{width:6px; height:6px; border-radius:50%; background:var(--mint); flex:none}

/* ── about + ledger ─────────────────────────────────────── */
.about-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:56px; align-items:start}
.about-body p{color:var(--ink2); font-size:18px}
.about-body p.lead{color:var(--ink); font-size:21px; font-weight:500}
.ledger{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:8px 26px; box-shadow:var(--shadow-m)}
.ledger-row{display:flex; align-items:baseline; gap:14px; padding:19px 0; border-bottom:1px dashed var(--line)}
.ledger-row:last-child{border-bottom:0}
.ledger-n{font-size:38px; line-height:1; font-weight:700; color:var(--violet); font-family:'Baloo Tamma 2',sans-serif; min-width:86px}
.ledger-k{font-size:15.5px; color:var(--ink2)}

/* ── plays ──────────────────────────────────────────────── */
.chips{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:30px}
.chip{
  background:var(--paper); border:1px solid var(--line); border-radius:99px; padding:9px 18px;
  font-size:14.5px; font-weight:500; color:var(--ink2); cursor:pointer; transition:.2s var(--ease);
}
.chip[aria-pressed="true"]{background:var(--violet); border-color:var(--violet); color:#fff}
.plays{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr)); gap:24px}
.play{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  cursor:pointer; text-align:left; padding:0; box-shadow:var(--shadow-s);
  transition:transform .3s var(--ease), box-shadow .3s var(--ease); display:flex; flex-direction:column;
}
.poster{aspect-ratio:4/3.1; padding:22px; display:flex; flex-direction:column; justify-content:space-between; position:relative}
.poster::after{
  content:""; position:absolute; inset:0; opacity:.5;
  background:radial-gradient(circle at 78% 12%,rgba(255,255,255,.85),transparent 55%);
}
.poster-photo{position:absolute; inset:0; z-index:2; overflow:hidden; background:var(--stage)}
.poster-photo .fill{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(20px) saturate(1.25); transform:scale(1.15); opacity:.75}
.poster-photo .front{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 10px 22px rgba(34,26,60,.28))}
.play.has-photo .poster-yr,.play.has-photo .poster-t{visibility:hidden}
.play.soon{border:1px dashed var(--line); background:transparent; box-shadow:none; cursor:default}
.play.soon .poster{opacity:.55}
.play.soon .poster-t{font-size:20px; max-width:100%; line-height:1.4}
.play.soon .tagline{color:var(--ink2)}
.play.soon .more{color:var(--ink2)}
.play-title{font-size:19px; line-height:1.3; margin:0 0 2px}
.play-title small{font-weight:400; font-size:14px; color:var(--ink2); letter-spacing:.06em}
.play:not(.has-photo) .play-title{display:none}
.poster-yr{font-size:12.5px; font-weight:700; letter-spacing:.12em; color:rgba(34,26,60,.55); position:relative; z-index:1}
.poster-t{font-size:27px; margin:0; position:relative; z-index:1; max-width:12ch}
.play-meta{padding:18px 22px 22px; display:flex; flex-direction:column; gap:8px; flex:1}
.tagline{font-size:15px; color:var(--ink2); flex:1}
.play-foot{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px 10px; font-size:13.5px; color:var(--ink2)}
.pill{background:var(--violet-soft); color:var(--violet); font-size:12.5px; font-weight:600; padding:4px 11px; border-radius:99px}
.more{color:var(--violet); font-weight:600; font-size:14px}

/* ── journey ────────────────────────────────────────────── */
.rail{position:relative; padding-left:34px; margin-top:6px}
.rail::before{content:""; position:absolute; left:7px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--violet),var(--mint),var(--marigold)); border-radius:2px; opacity:.4}
.stop{position:relative; padding:0 0 34px}
.stop::before{content:""; position:absolute; left:-34px; top:9px; width:16px; height:16px; border-radius:50%; background:var(--paper); border:3px solid var(--violet)}
.stop:nth-child(3n+2)::before{border-color:var(--mint)}
.stop:nth-child(3n+3)::before{border-color:var(--rose)}
.stop-y{font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--violet)}
.stop h3{margin:2px 0 5px; font-size:21px; font-weight:600}
.stop p{margin:0; color:var(--ink2); font-size:16.5px; max-width:62ch}

/* ── team ───────────────────────────────────────────────── */
.lead-pair{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr)); gap:24px; margin-bottom:24px}
.person{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:26px; box-shadow:var(--shadow-s); transition:.28s var(--ease)}
.person-top{display:flex; align-items:center; gap:16px}
.avatar{width:66px; height:66px; border-radius:20px; flex:none; display:grid; place-items:center; font-size:28px; font-weight:700; color:#fff; font-family:'Baloo Tamma 2',sans-serif; position:relative; overflow:hidden}
.avatar img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 25%}
.person h3{margin:0; font-size:21px; font-weight:600}
.person .role{font-size:14px; color:var(--violet); font-weight:600}
.person p{margin:15px 0 0; color:var(--ink2); font-size:16px}
.crew{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr)); gap:16px}
.crew .person{padding:20px}
.crew .avatar{width:50px; height:50px; border-radius:16px; font-size:21px}
.crew h3{font-size:18px}
.crew p{font-size:15px; margin-top:12px}

/* ── invite / services ─────────────────────────────────── */
.invite{background:var(--paper); border:1px solid var(--line); border-radius:34px; padding:52px 44px; box-shadow:var(--shadow-m); position:relative; overflow:hidden}
.invite::before{content:""; position:absolute; inset:auto -60px -120px auto; width:340px; height:340px; border-radius:50%; background:radial-gradient(circle,var(--violet-soft),transparent 68%)}
.invite .wrap-in{position:relative}
.svc{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr)); gap:20px; margin-top:34px}
.svc-card{padding:22px; border-radius:var(--r); border:1px dashed var(--line); background:var(--stage)}
.svc-ico{width:42px; height:42px; border-radius:13px; display:grid; place-items:center; margin-bottom:12px; background:var(--violet-soft)}
.svc-ico svg{width:22px; height:22px; stroke:var(--violet); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.svc-card h3{margin:0 0 6px; font-size:18px; font-weight:600}
.svc-card p{margin:0; font-size:15px; color:var(--ink2)}

/* ── voices ─────────────────────────────────────────────── */
.voices{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr)); gap:22px}
.voice{background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:26px; box-shadow:var(--shadow-s); position:relative}
.voice-mark{font-family:'Fraunces',serif; font-size:52px; line-height:.7; color:var(--rose); opacity:.5}
.voice p{margin:8px 0 16px; font-size:16.5px}
.voice .who{font-size:14px; color:var(--ink2); font-weight:600}

/* ── contact ────────────────────────────────────────────── */
.contact-grid{display:grid; grid-template-columns:.9fr 1.1fr; gap:44px; align-items:start}
.field{margin-bottom:16px}
.field label{display:block; font-size:14px; font-weight:600; margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%; padding:13px 15px; border-radius:var(--r-s); border:1px solid var(--line);
  background:var(--paper); font-family:inherit; font-size:16px; color:var(--ink);
}
.field textarea{min-height:118px; resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 4px var(--violet-soft)}
.two{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr)); gap:14px}
.contact-grid>*{min-width:0}          /* let grid items shrink below the <select>'s content width */
.field select{min-width:0; max-width:100%}
.form-note{font-size:14px; color:var(--ink2); margin:12px 0 0}
.reach{display:flex; flex-direction:column; gap:14px; margin-top:26px}
.reach a{display:flex; gap:13px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-s); padding:14px 16px; box-shadow:var(--shadow-s); transition:.2s var(--ease)}
.reach svg{width:20px; height:20px; stroke:var(--violet); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
.reach .k{font-size:12.5px; color:var(--ink2); display:block; line-height:1.3}
.reach .v{font-weight:600; font-size:15.5px}

/* ── footer ─────────────────────────────────────────────── */
footer{margin-top:92px; border-top:1px solid var(--line); background:var(--paper)}
.foot{display:flex; align-items:center; justify-content:space-between; gap:22px; padding-block:34px; flex-wrap:wrap; font-size:14.5px; color:var(--ink2)}

/* ── modal ──────────────────────────────────────────────── */
.sheet{position:fixed; inset:0; z-index:100; display:none; padding:26px}
.sheet.open{display:grid; place-items:center}
.veil{position:absolute; inset:0; background:rgba(34,26,60,.42); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px)}
.sheet-card{
  position:relative; background:var(--paper); border-radius:28px; max-width:760px; width:100%;
  max-height:88vh; max-height:88dvh; overflow-y:auto; overscroll-behavior:contain; box-shadow:0 50px 90px -40px rgba(34,26,60,.6);
  animation:pop .3s var(--ease);
}
@keyframes pop{from{opacity:0; transform:translateY(18px) scale(.98)}}
.sheet-hero{padding:34px 34px 26px; position:relative}
.sheet-cap{margin:-34px -34px 22px; padding:40px 34px 30px; border-radius:28px 28px 0 0}
.sheet-poster{width:104px; aspect-ratio:3/4; object-fit:cover; border-radius:14px; float:left; margin:0 20px 12px 0; box-shadow:var(--shadow-m)}
.sheet-hero h2{font-size:clamp(28px,4vw,40px); margin:8px 0 6px}
.sheet-body{padding:28px 34px 34px}
.credits{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr)); gap:2px 20px; margin:0 0 24px; padding:20px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.credits div{padding:8px 0}
.credits dt{font-size:12.5px; color:var(--ink2); letter-spacing:.05em}
.credits dd{margin:2px 0 0; font-weight:600; font-size:16.5px}
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(120px,100%),1fr)); gap:10px; margin-top:22px}
.frame{aspect-ratio:1; border-radius:14px; border:1px dashed rgba(34,26,60,.22); display:grid; place-items:center; font-size:11.5px; color:var(--ink2); text-align:center; padding:6px}
.close{position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-size:19px; line-height:1; color:var(--ink); z-index:2}
.venues{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.venues span{font-size:13.5px; background:var(--stage); border:1px solid var(--line); padding:5px 12px; border-radius:99px}

/* ── reveal ─────────────────────────────────────────────── */
.rise{opacity:0; transform:translateY(22px); transition:opacity .7s var(--ease), transform .7s var(--ease)}
.rise.in{opacity:1; transform:none}

/* ── pointer ────────────────────────────────────────────── */
@media (hover:hover) and (pointer:fine){
  #preview-bar button:hover{background:rgba(255,255,255,.14)}
  nav a:hover{color:var(--violet); background:var(--violet-soft)}
  .btn-primary:hover{transform:translateY(-2px); background:var(--violet)}
  .btn-ghost:hover{transform:translateY(-2px); border-color:var(--violet); color:var(--violet)}
  .marquee:hover .marquee-track{animation-play-state:paused}
  .chip:hover{border-color:var(--violet); color:var(--violet)}
  .play:hover{transform:translateY(-6px) rotate(-.5deg); box-shadow:var(--shadow-l)}
  .person:hover{box-shadow:var(--shadow-m); transform:translateY(-4px)}
  .reach a:hover{border-color:var(--violet); transform:translateX(3px)}
  .close:hover{background:var(--violet); color:#fff; border-color:var(--violet)}
}
/* touch feedback in place of hover */
.play:active,.person:active{transform:scale(.985)}
.btn:active{transform:translateY(1px)}
/* ── social row + scroll to top ─────────────────────────── */
.social-row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding-block:32px 6px}
.social{width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
        background:var(--stage); border:1px solid var(--line); transition:.22s var(--ease)}
.social svg{width:21px; height:21px; stroke:var(--violet); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.foot{border-top:1px solid var(--line)}

.totop{
  position:fixed; z-index:2100;
  right:max(18px,env(safe-area-inset-right));
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:50px; height:50px; border-radius:50%; border:0; cursor:pointer;
  background:var(--ink); display:grid; place-items:center; box-shadow:var(--shadow-m);
  opacity:0; visibility:hidden; transform:translateY(12px);
  transition:opacity .25s var(--ease), transform .25s var(--ease), visibility .25s;
}
.totop.show{opacity:1; visibility:visible; transform:none}
#loadFail{position:fixed; inset:0; z-index:3000; background:var(--stage); display:grid; place-content:center; gap:16px; text-align:center; padding:30px}
#loadFail[hidden]{display:none}
#loadFail button{background:var(--ink); color:#fff; border:0; border-radius:99px; padding:12px 24px; font-size:16px; cursor:pointer}
.totop svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
body:has(.sheet.open) .totop{opacity:0; visibility:hidden}
@media (hover:hover) and (pointer:fine){
  .social:hover{background:var(--violet); border-color:var(--violet); transform:translateY(-3px)}
  .social:hover svg{stroke:#fff}
  .totop:hover{background:var(--violet); transform:translateY(-3px)}
}
@media (max-width:620px){
  .totop{width:46px; height:46px; right:max(18px,env(safe-area-inset-right)); bottom:calc(18px + env(safe-area-inset-bottom))}
}
/* ── responsive ─────────────────────────────────────────── */
@media (max-width:900px){
  .about-grid,.contact-grid{grid-template-columns:1fr; gap:30px}
  nav{
    position:fixed; inset:var(--hdr) 0 auto; background:var(--paper); flex-direction:column;
    align-items:stretch; padding:14px; padding-bottom:max(14px,env(safe-area-inset-bottom));
    gap:2px; border-bottom:1px solid var(--line); box-shadow:var(--shadow-m); display:none; margin:0;
    max-height:calc(100dvh - var(--hdr)); overflow-y:auto;
  }
  nav.open{display:flex}
  nav a{padding:13px 16px; font-size:17px}
  .burger{display:block}
  .lang{margin:8px 0 0; justify-content:center}
  .bar{gap:12px}
  .invite{padding:34px 22px; border-radius:26px}
  .sect{padding-block:70px 4px}
}
@media (max-width:620px){
  :root{--hdr:66px}
  .wrap{padding-left:max(24px,env(safe-area-inset-left)); padding-right:max(24px,env(safe-area-inset-right))}
  body{font-size:16px}
  #preview-bar{font-size:12.5px; line-height:1.45; text-align:center}
  .sect{padding-block:56px 4px}
  .sect-head{margin-bottom:26px}
  .hero{padding:44px 0 30px}
  .medallion{width:128px; height:128px}
  .medallion i{font-size:54px}
  .quote{font-size:17px; padding:0 22px}
  .cta-row{flex-direction:column}
  .cta-row .btn{width:100%; justify-content:center}
  .bell-label{padding:13px 22px 13px 16px; font-size:13px}
  .ledger{padding:6px 20px}
  .ledger-n{font-size:32px; min-width:72px}
  .sheet{padding:0}
  .sheet-card{border-radius:0; height:100%; max-height:100vh; max-height:100dvh}
  .sheet-hero{padding:26px 24px 20px}
  .sheet-cap{margin:-26px -24px 18px; padding:30px 24px 24px; border-radius:0}
  .sheet-body{padding:24px 24px calc(34px + env(safe-area-inset-bottom))}
  .sheet-poster{width:84px; margin:0 16px 10px 0}
  .foot{flex-direction:column; align-items:flex-start; gap:8px; padding-block:26px}
}
@media (max-width:400px){
  .wrap{padding-left:max(22px,env(safe-area-inset-left)); padding-right:max(22px,env(safe-area-inset-right))}
  .logo-badge{width:40px; height:40px; border-radius:12px}
  .logo-badge svg{width:25px; height:25px}
  .logo-name{font-size:20px}
  .medallion{width:112px; height:112px}
  .medallion i{font-size:46px}
  .perch{width:36px; height:36px; top:-12px; right:-10px}
  .perch svg{width:21px; height:21px}
  .credits,.two{grid-template-columns:1fr}
  .bell-label{font-size:12px; padding:11px 18px 11px 14px}
}
/* phone held sideways — short screens */
@media (max-height:500px) and (orientation:landscape){
  .hero{padding:34px 0 24px}
  .medallion{width:104px; height:104px}
  .medallion i{font-size:42px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
  html{scroll-behavior:auto}
  .rise{opacity:1; transform:none}
}
</style>
</head>
<body>

<!-- preview notice (delete this block when real content goes in) -->
<div id="preview-bar">
  <span data-i18n="preview"></span>
  <button type="button" aria-label="Close" onclick="this.parentNode.remove()">×</button>
</div>

<header>
  <div class="wrap bar">
    <!-- top-left: logo -->
    <a class="logo" href="#top" aria-label="Kaajana">
      <span class="logo-badge">
        <svg viewBox="0 0 40 40" aria-hidden="true" fill="#fff">
          <path d="M14.6 24.2 4.2 37.4c-.5.6.3 1.4.9.9l7.6-5.9-1 4.7c-.1.8.9 1.2 1.4.6l6.5-8.6-5-4.9Z"/>
          <ellipse cx="19.4" cy="20.4" rx="7.3" ry="8.4" transform="rotate(-22 19.4 20.4)"/>
          <circle cx="25.6" cy="12.6" r="5.4"/>
          <path d="M24.4 6.9c-.2-2 1-3.6 2.6-4.4-.4 1.6-.2 2.9.6 4.1l-3.2.3Z"/>
          <path d="m30.4 10.9 6.9 1.9-6.7 2.6-.2-4.5Z"/>
          <circle cx="27.2" cy="11.6" r="1.15" fill="#5B3CC4"/>
          <path d="M17.6 15.4c3.6.6 6.2 3.4 6.9 7.1-3.2-1.1-5.7-3.5-6.9-7.1Z" fill="rgba(255,255,255,.45)"/>
        </svg>
      </span>
      <span>
        <span class="logo-name display" data-i18n="brand"></span>
        <span class="logo-sub" data-i18n="brandSub"></span>
      </span>
    </a>

    <button class="burger" type="button" aria-label="Menu" aria-expanded="false" id="burger">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#plays" data-i18n="nav.plays"></a>
      <a href="#journey" data-i18n="nav.journey"></a>
      <a href="#team" data-i18n="nav.team"></a>
      <a href="#invite" data-i18n="nav.invite"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang-btn="kn" aria-pressed="true">ಕನ್ನಡ</button>
        <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
      </div>
    </nav>
  </div>
</header>

<div id="loadFail" hidden>
  <p>ವಿಷಯ ಲೋಡ್ ಆಗಲಿಲ್ಲ. · Content failed to load.</p>
  <button type="button" onclick="location.reload()">ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ · Retry</button>
</div>

<main id="top">

  <!-- HERO — founder at centre stage -->
  <section class="hero">
    <div class="gels" aria-hidden="true">
      <svg viewBox="0 0 1200 640" preserveAspectRatio="xMidYMin slice">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFA630" stop-opacity=".55"/><stop offset="1" stop-color="#FFA630" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#57C4A5" stop-opacity=".5"/><stop offset="1" stop-color="#57C4A5" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E85C8A" stop-opacity=".45"/><stop offset="1" stop-color="#E85C8A" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g style="filter:blur(14px)">
          <polygon points="470,-40 530,-40 300,600 60,600" fill="url(#g1)"/>
          <polygon points="580,-40 640,-40 760,600 470,600" fill="url(#g2)"/>
          <polygon points="690,-40 750,-40 1160,600 880,600" fill="url(#g3)"/>
        </g>
      </svg>
    </div>

    <div class="wrap">
      <div class="eyebrow hero-eyebrow"><span data-i18n="hero.badge"></span></div>

      <div class="founder">
        <div class="medallion">
          <i id="heroInitial"></i>
          <span class="perch" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="#4A2C00">
              <path d="M14.6 24.2 4.2 37.4c-.5.6.3 1.4.9.9l7.6-5.9-1 4.7c-.1.8.9 1.2 1.4.6l6.5-8.6-5-4.9Z"/>
              <ellipse cx="19.4" cy="20.4" rx="7.3" ry="8.4" transform="rotate(-22 19.4 20.4)"/>
              <circle cx="25.6" cy="12.6" r="5.4"/><path d="m30.4 10.9 6.9 1.9-6.7 2.6-.2-4.5Z"/>
            </svg>
          </span>
        </div>
        <div class="founder-role" id="heroRole"></div>
        <p class="founder-name display" id="heroName"></p>
      </div>

      <h1 class="display" id="heroTitle"></h1>
      <p class="quote" data-i18n="hero.quote"></p>

      <div class="cta-row">
        <a class="btn btn-primary" href="#contact"><span data-i18n="cta.book"></span> →</a>
        <a class="btn btn-ghost" href="#plays" data-i18n="cta.see"></a>
      </div>
    </div>

    <!-- third-bell ticker -->
    <div class="bell">
      <div class="wrap bell-in">
        <div class="bell-label"><span data-i18n="bell.label"></span></div>
        <div class="marquee"><div class="marquee-track" id="ticker"></div></div>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section class="sect wrap" id="about">
    <div class="about-grid">
      <div class="about-body rise">
        <div class="eyebrow" data-i18n="about.eyebrow"></div>
        <h2 class="display" style="font-size:clamp(30px,4.4vw,46px); margin:12px 0 16px" data-i18n="about.h"></h2>
        <p class="lead" data-i18n="about.lead"></p>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </div>
      <div class="ledger rise" id="ledger"></div>
    </div>
  </section>

  <!-- PLAYS -->
  <section class="sect wrap" id="plays">
    <div class="sect-head rise">
      <div class="eyebrow" data-i18n="plays.eyebrow"></div>
      <h2 class="display" data-i18n="plays.h"></h2>
      <p data-i18n="plays.sub"></p>
    </div>
    <div class="chips rise" id="chips" role="group"></div>
    <div class="plays" id="playGrid"></div>
  </section>

  <!-- JOURNEY -->
  <section class="sect wrap" id="journey">
    <div class="sect-head rise">
      <div class="eyebrow" data-i18n="journey.eyebrow"></div>
      <h2 class="display" data-i18n="journey.h"></h2>
      <p data-i18n="journey.sub"></p>
    </div>
    <div class="rail rise" id="rail"></div>
  </section>

  <!-- TEAM -->
  <section class="sect wrap" id="team">
    <div class="sect-head rise">
      <div class="eyebrow" data-i18n="team.eyebrow"></div>
      <h2 class="display" data-i18n="team.h"></h2>
      <p data-i18n="team.sub"></p>
    </div>
    <div class="lead-pair rise" id="leads"></div>
    <div class="crew rise" id="crew"></div>
  </section>

  <!-- INVITE -->
  <section class="sect wrap" id="invite">
    <div class="invite rise">
      <div class="wrap-in">
        <div class="eyebrow" data-i18n="invite.eyebrow"></div>
        <h2 class="display" style="font-size:clamp(28px,4vw,42px); margin:12px 0 10px; max-width:20ch" data-i18n="invite.h"></h2>
        <p style="color:var(--ink2); max-width:60ch; margin:0" data-i18n="invite.sub"></p>
        <div class="svc" id="svc"></div>
      </div>
    </div>
  </section>

  <!-- VOICES -->
  <section class="sect wrap" id="voices">
    <div class="sect-head rise">
      <div class="eyebrow" data-i18n="voices.eyebrow"></div>
      <h2 class="display" data-i18n="voices.h"></h2>
    </div>
    <div class="voices rise" id="voiceGrid"></div>
  </section>

  <!-- CONTACT -->
  <section class="sect wrap" id="contact">
    <div class="sect-head rise">
      <div class="eyebrow" data-i18n="contact.eyebrow"></div>
      <h2 class="display" data-i18n="contact.h"></h2>
      <p data-i18n="contact.sub"></p>
    </div>
    <div class="contact-grid">
      <div class="rise">
        <div class="reach" id="reach"></div>
      </div>
      <div class="rise">
        <div class="two">
          <div class="field">
            <label for="f-name" data-i18n="form.name"></label>
            <input id="f-name" type="text" autocomplete="name">
          </div>
          <div class="field">
            <label for="f-mail" data-i18n="form.mail"></label>
            <input id="f-mail" type="email" autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="f-why" data-i18n="form.why"></label>
          <select id="f-why"></select>
        </div>
        <div class="field">
          <label for="f-msg" data-i18n="form.msg"></label>
          <textarea id="f-msg"></textarea>
        </div>
        <button class="btn btn-primary" type="button" id="send" data-i18n="form.send" title="Send"></button>
        <p class="form-note" id="formNote" data-i18n="form.note"></p>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap social-row" id="social"></div>
  <div class="wrap foot">
    <span data-i18n="foot.left"></span>
    <span data-i18n="foot.right"></span>
  </div>
</footer>

<button class="totop" id="toTop" type="button" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<!-- play detail sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="veil" data-close></div>
  <div class="sheet-card">
    <button class="close" type="button" data-close aria-label="Close">×</button>
    <div class="sheet-hero" id="sheetHero"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONTENT — everything lives here. Swap the kn/en strings and
   the whole site updates in both languages.
   ═══════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════
   UI LABELS — stay in code. These are the words the page needs to
   work (menu, buttons, field labels, units). Not editable in the CMS,
   because a blank nav label breaks the page.
   ═══════════════════════════════════════════════════════════ */
const UI = {
  'brand':         {kn:'ಕಾಜಾಣ', en:'Kaajana'},
  'brandSub':      {kn:'ರಂಗತಂಡ · ಬೆಂಗಳೂರು', en:'Theatre · Bengaluru'},
  'c.cast':        {kn:'ಪಾತ್ರವರ್ಗ', en:'Cast'},
  'c.dir':         {kn:'ನಿರ್ದೇಶನ', en:'Directed by'},
  'c.lang':        {kn:'ಭಾಷೆ', en:'Language'},
  'c.shows':       {kn:'ಪ್ರದರ್ಶನಗಳು', en:'Performances'},
  'c.time':        {kn:'ಅವಧಿ', en:'Runtime'},
  'c.writer':      {kn:'ರಚನೆ', en:'Written by'},
  'cta.book':      {kn:'ಪ್ರದರ್ಶನಕ್ಕೆ ಆಹ್ವಾನಿಸಿ', en:'Book a show'},
  'cta.see':       {kn:'ನಾಟಕಗಳನ್ನು ನೋಡಿ', en:'Browse the plays'},
  'form.mail':     {kn:'ಇ-ಮೇಲ್', en:'Email'},
  'form.msg':      {kn:'ಸಂದೇಶ', en:'Message'},
  'form.name':     {kn:'ನಿಮ್ಮ ಹೆಸರು', en:'Your name'},
  'form.needMsg':  {kn:'ಸಂದೇಶ ಬರೆಯಿರಿ.', en:'Add a message.'},
  'form.needName': {kn:'ಹೆಸರು ಬರೆಯಿರಿ.', en:'Add your name.'},
  'form.opened':   {kn:'ಇ-ಮೇಲ್ ಡ್ರಾಫ್ಟ್ ಸಿದ್ಧವಾಗಿದೆ.', en:'Email draft is ready.'},
  'form.send':     {kn:'ಇ-ಮೇಲ್ ಡ್ರಾಫ್ಟ್ ತೆರೆಯಿರಿ', en:'Open email draft'},

  'kannada':       {kn:'ಕನ್ನಡ', en:'Kannada'},

/* ═══════════════════════════════════════════════════════════
   CONTENT — everything below is loaded from content.json at
   startup. Edit that file (or the admin panel), never this.
   ═══════════════════════════════════════════════════════════ */
/* icon paths — referenced by name from content.json, never edited there */
const ICONS = {
  instagram:  'M17 2H7a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h10a5 5 0 0 0 5-5V7a5 5 0 0 0-5-5ZM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7ZM17.5 6.2h.01',
  youtube:    'M22 12s0-3.3-.4-4.9a2.6 2.6 0 0 0-1.8-1.8C18.2 4.9 12 4.9 12 4.9s-6.2 0-7.8.4a2.6 2.6 0 0 0-1.8 1.8C2 8.7 2 12 2 12s0 3.3.4 4.9a2.6 2.6 0 0 0 1.8 1.8c1.6.4 7.8.4 7.8.4s6.2 0 7.8-.4a2.6 2.6 0 0 0 1.8-1.8c.4-1.6.4-4.9.4-4.9ZM10 15.2l5-3.2-5-3.2v6.4Z',
  facebook:   'M14 8.5V6.6c0-.8.2-1.3 1.4-1.3H17V2.2c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.5-4 4.2v2.2H8V12h2.6v9.8h3.1V12h2.6l.4-3.5H14Z',
  whatsapp:   'M20.5 11.6a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5 5 16.2a8.5 8.5 0 1 1 15.5-4.6ZM8.9 8.6c-.3.7-.1 1.6.5 2.5.9 1.4 2.1 2.3 3.4 2.7.8.2 1.5.1 1.9-.3l.5-.6-1.7-1.1-.7.6c-.6-.3-1.4-1-1.8-1.8l.6-.7-1.1-1.7-.6.4Z',
  email:      'M4 4h16v16H4zM4 7l8 6 8-6',
  phone:      'M22 16.9v3a2 2 0 0 1-2.2 2 19 19 0 0 1-8.3-3 18.6 18.6 0 0 1-5.7-5.7 19 19 0 0 1-3-8.4A2 2 0 0 1 4.8 3h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L9 10.7a15 15 0 0 0 5.7 5.7l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z',
  location:   'M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7ZM12 11.5A2.5 2.5 0 1 0 12 6.5a2.5 2.5 0 0 0 0 5Z',
  stage:      'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6',
  workshop:   'M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2ZM8 12h8M8 16h5',
  street:     'M12 3v18M5 8l7-5 7 5M5 8v8l7 5 7-5V8',
  class:      'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8ZM21 21v-2a4 4 0 0 0-3-3.9'
};
const SWATCH = ['#5B3CC4','#E85C8A','#57C4A5','#FFA630'];      // avatar colours, by position
const HUE    = [['#FFE3BC','#FFC48A'],['#D6F3E7','#A8E6CF'],['#E7DEFF','#C9B8FF'],
                ['#FFD9E4','#FFB3C8'],['#CFEBFF','#A7D8F5'],['#EDE9FB','#DCD5F6']];
const icon = k => ICONS[k] || '';

/* first letter of a name — grapheme-aware, so ಬೇ stays whole */
function initialOf(str){
  const s = String(str || '').trim();
  if (!s) return '';
  let g;
  try { g = [...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(s)].map(x => x.segment); }
  catch(e){ return s.slice(0,2); }
  let out = g[0];
  // a cluster ending in virama is only half a letter — pull in the next one
  if (out.endsWith('\u0CCD') && g[1]) out += g[1];
  return out;
}
const monogram = p => L(p.mono) || initialOf(L(p.n));   // stored initials win

let STR = Object.assign({}, UI);
let LEDGER = [], WHY = [], UPCOMING = [], TAGS = [], PLAYS = [], JOURNEY = [],
    LEADS = [], CREW = [], SVCS = [], VOICES = [], SOCIAL = [], REACH = [];

function applyContent(C){
  const flat = {};                                     // {about:{h:…}} -> {'about.h':…}
  Object.entries(C.strings || {}).forEach(([g,obj]) =>
    Object.entries(obj || {}).forEach(([k,v]) => { flat[g + '.' + k] = v; }));
  STR      = Object.assign({}, flat, UI);              // UI labels win if a key clashes
  LEDGER   = C.ledger     || [];
  WHY      = C.whyOptions || [];
  UPCOMING = C.upcoming   || [];
  TAGS     = C.tags       || [];
  PLAYS    = C.plays      || [];
  JOURNEY  = C.journey    || [];
  LEADS    = C.leads      || [];
  CREW     = C.crew       || [];
  SVCS     = C.services   || [];
  VOICES   = C.voices     || [];
  SOCIAL   = C.social     || [];
  REACH    = C.reach      || [];
}

/* ═══════════════════════════════════════════════════════════
   ENGINE
   ═══════════════════════════════════════════════════════════ */
let lang = 'kn';
let filter = 'all';
const KN_D = '೦೧೨೩೪೫೬೭೮೯';
const n = v => lang === 'kn' ? String(v).replace(/[0-9]/g, d => KN_D[+d]) : String(v);
const L = o => (o && typeof o === 'object' && !Array.isArray(o)) ? (o[lang] ?? o.en) : o;
const t = k => L(STR[k]) || '';
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function paintStatic(){
  document.documentElement.lang = lang;
  document.documentElement.dataset.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = t(node.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(node => { node.innerHTML = t(node.dataset.i18nHtml); });
  const pv = document.querySelector('#preview-bar span');
  if (pv) pv.innerHTML = t('preview');
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langBtn === lang)));
  // any content field left blank hides its element rather than leaving a gap
  document.querySelectorAll('[data-i18n]').forEach(node => {
    if (node.closest('nav, .lang, .chips')) return;     // never hide navigation
    node.style.display = node.textContent.trim() ? '' : 'none';
  });
  const q = document.querySelector('.quote');
  if (q) q.style.display = t('hero.quote') ? '' : 'none';

  // hero identity comes from the first person in `leads` — one place to edit
  const lead = LEADS[0];
  if (lead){
    document.getElementById('heroInitial').textContent = monogram(lead);
    document.getElementById('heroRole').textContent    = L(lead.r);
    document.getElementById('heroName').textContent    = L(lead.n);
  }
  const mark = t('hero.titleMark');
  document.getElementById('heroTitle').innerHTML =
    esc(t('hero.titleLead')) + (mark ? ` <em>${esc(mark)}</em>` : '');
}

function paintTicker(){
  const row = UPCOMING.map(u => `<span class="tick"><span class="dot"></span><b>${esc(L(u))}</b></span>`).join('');
  document.getElementById('ticker').innerHTML = row + row;
}

function paintLedger(){
  document.getElementById('ledger').innerHTML = LEDGER.map(r =>
    `<div class="ledger-row"><span class="ledger-n">${n(r.n)}${r.suffix||''}</span><span class="ledger-k">${esc(L(r))}</span></div>`
  ).join('');
}

function paintChips(){
  const box = document.getElementById('chips');
  box.innerHTML = '';
  [{id:'all', kn:t('plays.all'), en:t('plays.all')}, ...TAGS].forEach(tag => {
    const b = el('button', 'chip', esc(tag.id === 'all' ? t('plays.all') : L(tag)));
    b.type = 'button';
    b.setAttribute('aria-pressed', String(filter === tag.id));
    b.onclick = () => { filter = tag.id; paintChips(); paintPlays(); };
    box.appendChild(b);
  });
}

function dropPoster(img){                 // poster missing -> fall back to the gradient card
  const card = img.closest('.play');
  const layer = img.closest('.poster-photo');
  if (layer) layer.remove();
  if (card) card.classList.remove('has-photo');
}

function paintPlays(){
  const grid = document.getElementById('playGrid');
  grid.innerHTML = '';
  const list = PLAYS.filter(p => p.soon || filter === 'all' || p.tag === filter)
                    .sort((a, b) => (a.soon ? 1 : 0) - (b.soon ? 1 : 0));   // placeholders last
  list.forEach(p => {
    const tag = TAGS.find(x => x.id === p.tag);
    if (!p.hue) p.hue = HUE[PLAYS.indexOf(p) % HUE.length];   // new plays get a colour automatically
    const card = el(p.soon ? 'div' : 'button', p.soon ? 'play soon' : 'play');
    if (!p.soon) card.type = 'button';
    if (p.img) card.classList.add('has-photo');
    card.innerHTML = `
      <span class="poster" style="background:linear-gradient(150deg,${p.hue[0]},${p.hue[1]})">
        <span class="poster-yr">${n(p.y)}</span>
        <span class="poster-t display">${esc(L(p.t))}</span>
        ${p.img ? `<span class="poster-photo">
          <img class="fill" src="${p.img}" alt="" aria-hidden="true">
          <img class="front" src="${p.img}" alt="${esc(L(p.t))}" onerror="dropPoster(this)">
        </span>` : ''}
      </span>
      <span class="play-meta">
        <span class="play-title display">${esc(L(p.t))}${p.y ? ` <small>· ${n(p.y)}</small>` : ''}</span>
        <span class="tagline">${esc(L(p.line))}</span>
        <span class="play-foot">
          ${tag ? `<span class="pill">${esc(L(tag))}</span>` : ''}
          <span class="more">${p.soon ? esc(t('plays.soon')) : `${n(p.shows)} ${esc(t('c.shows'))} →`}</span>
        </span>
      </span>`;
    if (!p.soon) card.onclick = () => openSheet(PLAYS.indexOf(p));
    grid.appendChild(card);
  });
}

function paintJourney(){
  document.getElementById('rail').innerHTML = JOURNEY.map(s => `
    <div class="stop">
      <div class="stop-y">${n(s.y)}</div>
      <h3>${esc(L(s.h))}</h3>
      <p>${esc(L(s.p))}</p>
    </div>`).join('');
}

function personCard(p, i){
  const swatch = p.c || SWATCH[i % SWATCH.length];
  return `<div class="person">
    <div class="person-top">
      <span class="avatar" style="background:${swatch}">${esc(monogram(p))}${p.img ? `<img src="${p.img}" alt="${esc(L(p.n))}"${p.pos ? ` style="object-position:${p.pos}"` : ''} onerror="this.remove()">` : ''}</span>
      <span>
        <h3>${esc(L(p.n))}</h3>
        <span class="role">${esc(L(p.r))}</span>
      </span>
    </div>
    <p>${esc(L(p.b))}</p>
  </div>`;
}

function paintFounderPhoto(){
  const med = document.querySelector('.medallion');
  const had = med.querySelector('img');
  if (had) had.remove();
  const f = LEADS[0];
  if (!f.img) return;
  const im = new Image();
  im.src = f.img;
  im.alt = L(f.n);
  if (f.pos) im.style.objectPosition = f.pos;
  im.onerror = () => im.remove();          // no photo yet -> monogram stays
  med.insertBefore(im, med.querySelector('.perch'));
}

function paintTeam(){
  document.getElementById('leads').innerHTML = LEADS.map(personCard).join('');
  document.getElementById('crew').innerHTML = CREW.map(personCard).join('');
}

function paintSvc(){
  document.getElementById('svc').innerHTML = SVCS.map(s => `
    <div class="svc-card">
      <span class="svc-ico"><svg viewBox="0 0 24 24"><path d="${icon(s.icon)}"/></svg></span>
      <h3>${esc(L(s.t))}</h3>
      <p>${esc(L(s.d))}</p>
    </div>`).join('');
}

function paintVoices(){
  document.getElementById('voiceGrid').innerHTML = VOICES.map(v => `
    <div class="voice">
      <div class="voice-mark">“</div>
      <p>${esc(L(v.q))}</p>
      <div class="who">${esc(L(v.w))}</div>
    </div>`).join('');
}

function paintReach(){
  document.getElementById('reach').innerHTML = REACH.map(r => `
    <a href="${r.href}" ${/^https?:/i.test(r.href) ? 'target="_blank" rel="noopener noreferrer"' : ''}>
      <svg viewBox="0 0 24 24"><path d="${icon(r.icon)}"/></svg>
      <span><span class="k">${esc(L(r.k))}</span><span class="v">${esc(L(r.v))}</span></span>
    </a>`).join('');
}

function paintForm(){
  const sel = document.getElementById('f-why');
  const keep = sel.selectedIndex;
  sel.innerHTML = WHY.map(o => `<option>${esc(L(o))}</option>`).join('');
  if (keep > -1) sel.selectedIndex = keep;
}

/* play detail sheet */
const sheet = document.getElementById('sheet');
let lastFocus = null;

function openSheet(idx){
  const p = PLAYS[idx];
  const tag = TAGS.find(x => x.id === p.tag);
  lastFocus = document.activeElement;
  document.getElementById('sheetHero').innerHTML = `
    <div class="sheet-cap" style="background:linear-gradient(150deg,${p.hue[0]},${p.hue[1]})">
      ${p.img ? `<img class="sheet-poster" src="${p.img}" alt="${esc(L(p.t))}" onerror="this.remove()">` : ''}
      ${tag || p.y ? `<span class="pill" style="background:rgba(255,255,255,.7);color:var(--ink)">${[tag ? esc(L(tag)) : '', p.y ? n(p.y) : ''].filter(Boolean).join(' · ')}</span>` : ''}
      <h2 class="display" id="sheetTitle">${esc(L(p.t))}</h2>
      <p style="margin:0;color:rgba(34,26,60,.72);font-size:18px">${esc(L(p.line))}</p>
    </div>`;
  const row = (k, v) => v ? `<div><dt>${esc(t(k))}</dt><dd>${v}</dd></div>` : '';
  const credits = [
    row('c.writer', esc(L(p.writer))),
    row('c.dir',    esc(L(p.dir))),
    row('c.time',   p.time  ? `${n(p.time)} ${esc(t('u.min'))}`    : ''),
    row('c.cast',   p.cast  ? `${n(p.cast)} ${esc(t('u.people'))}` : ''),
    row('c.shows',  p.shows ? n(p.shows) : ''),
    row('c.lang',   esc(t('kannada')))
  ].join('');
  const story  = L(p.story) || '';
  const venues = L(p.venues) || [];
  document.getElementById('sheetBody').innerHTML = `
    ${credits ? `<dl class="credits">${credits}</dl>` : ''}
    ${story ? `<h3 class="display" style="font-size:21px;margin:0 0 8px">${esc(t('sheet.story'))}</h3>
    <p style="margin:0 0 22px;color:var(--ink2);font-size:17px">${esc(story)}</p>` : ''}
    ${venues.length ? `<h3 class="display" style="font-size:21px;margin:0 0 4px">${esc(t('sheet.venues'))}</h3>
    <div class="venues">${venues.map(v => `<span>${esc(v)}</span>`).join('')}</div>` : ''}
    <div class="strip">${[1,2,3,4].map(() => `<div class="frame">${esc(t('sheet.photos'))}</div>`).join('')}</div>`;
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
  sheet.querySelector('.close').focus();
}

function closeSheet(){
  sheet.classList.remove('open');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}
sheet.querySelectorAll('[data-close]').forEach(x => x.onclick = closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });

/* language toggle */
function setLang(next){
  lang = next;
  render();
  if (sheet.classList.contains('open')) closeSheet();
}
document.querySelectorAll('[data-lang-btn]').forEach(b => b.onclick = () => setLang(b.dataset.langBtn));

/* mobile nav */
const nav = document.getElementById('nav'), burger = document.getElementById('burger');
burger.onclick = () => {
  const open = nav.classList.toggle('open');
  burger.setAttribute('aria-expanded', String(open));
};
nav.querySelectorAll('a').forEach(a => a.onclick = () => { nav.classList.remove('open'); burger.setAttribute('aria-expanded','false'); });

/* contact → email draft */
document.getElementById('send').onclick = () => {
  const name = document.getElementById('f-name').value.trim();
  const mail = document.getElementById('f-mail').value.trim();
  const why  = document.getElementById('f-why').value;
  const msg  = document.getElementById('f-msg').value.trim();
  const note = document.getElementById('formNote');
  if (!name) { note.textContent = t('form.needName'); document.getElementById('f-name').focus(); return; }
  if (!msg)  { note.textContent = t('form.needMsg');  document.getElementById('f-msg').focus();  return; }
  const body = `${msg}\n\n—\n${name}${mail ? '\n' + mail : ''}`;
  window.location.href = `mailto:namaskara@kaajana.in?subject=${encodeURIComponent(why + ' — ' + name)}&body=${encodeURIComponent(body)}`;
  note.textContent = t('form.opened');
};

/* scroll reveal */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.rise').forEach(x => io.observe(x));
function paintSocial(){
  document.getElementById('social').innerHTML = SOCIAL
    .filter(s => s.href && s.href !== '#')          // an icon that goes nowhere never renders
    .map(s => `
      <a class="social" href="${s.href}" aria-label="${esc(s.k || s.icon)}" title="${esc(s.k || s.icon)}"
         ${/^https?:/i.test(s.href) ? 'target="_blank" rel="noopener noreferrer"' : ''}>
        <svg viewBox="0 0 24 24"><path d="${icon(s.icon)}"/></svg>
      </a>`).join('');
}

/* scroll to top — lives directly on <body>, so no transformed ancestor
   can hijack its containing block and pin it mid-page */
const toTop = document.getElementById('toTop');
const calmScroll = matchMedia('(prefers-reduced-motion: reduce)').matches;
const toggleTop = () => toTop.classList.toggle('show', window.scrollY > 320);
['scroll','resize','load','orientationchange'].forEach(ev =>
  window.addEventListener(ev, toggleTop, {passive:true}));
toggleTop();
toTop.onclick = () => window.scrollTo({top:0, behavior: calmScroll ? 'auto' : 'smooth'});
async function boot(){
  try {
    const res = await fetch('content.json?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    applyContent(await res.json());
    render();
  } catch (err) {
    console.error('content.json could not be loaded:', err);
    document.getElementById('loadFail').hidden = false;
  }
}

function render(){
  paintStatic(); paintTicker(); paintLedger(); paintChips(); paintPlays();
  paintFounderPhoto(); paintSocial();
  paintJourney(); paintTeam(); paintSvc(); paintVoices(); paintReach(); paintForm();
  document.title = lang === 'kn' ? 'ಕಾಜಾಣ ರಂಗತಂಡ · ಬೆಂಗಳೂರು' : 'Kaajana Theatre · Bengaluru';
}
boot();
</script>
