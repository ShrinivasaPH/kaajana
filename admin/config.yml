# ═══════════════════════════════════════════════════════════════════
#  1. Paste the backend block DecapBridge generated for you ABOVE the
#     "media_folder" line below, then delete this comment.
#     It looks like:
#
#        backend:
#          name: git-gateway
#          identity_url: "https://decapbridge.com/sites/<your-site-id>"
#          gateway_url: "https://gateway.decapbridge.com"
#          commit_messages: ...
#        logo_url: https://decapbridge.com/...
#
#  2. Do NOT add a leading slash to public_folder. The site lives at
#     /kaajana/, so "/images" would resolve to the domain root and every
#     uploaded image would 404.
# ═══════════════════════════════════════════════════════════════════

